# Tests run in parallel: classes and their methods at the same time (every test has its own project, see TestProject).
# The number of threads comes from Gradle (-Pthreads=8; half of the processors by default).
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
junit.jupiter.execution.parallel.config.fixed.max-pool-size=64
junit.jupiter.execution.timeout.testable.method.default=60 s
junit.jupiter.displayname.generator.default=pl.databucket.e2e.support.Sentences
